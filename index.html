<!DOCTYPE html>
<html>
<head>
    <title>LA Metro Routing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map { 
            height: 80vh; /* Takes up 80% of the screen height */
            width: 100%; 
        }
        .controls { 
            padding: 20px; 
            background: #f4f4f4; 
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 2px solid #ddd;
        }
        button {
            padding: 8px 16px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0051a8;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="trucks"><strong>Trucks:</strong></label>
        <input type="number" id="trucks" value="3" min="1" max="10">
        
        <label for="minutes"><strong>Time Limit (mins):</strong></label>
        <input type="number" id="minutes" value="60" min="10" max="480">
        
        <button onclick="calculateRoute()">Optimize Route</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Initialize the map centered on Los Angeles
        var map = L.map('map').setView([34.0522, -118.2437], 12);
        
        // Use a dark theme map to make the bright route lines pop
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(map);

        // 2. The main function triggered when the button is clicked
        async function calculateRoute() {
            const trucks = document.getElementById('trucks').value;
            const minutes = document.getElementById('minutes').value;

            try {
                // Send the data to your Python Backend
                const response = await fetch('/api/optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        trucks: parseInt(trucks), 
                        minutes: parseInt(minutes) 
                    })
                });
                
                // SAFETY CHECK: If Python crashes, show the error on screen!
                if (!response.ok) {
                    const errorText = await response.text();
                    alert("🚨 Backend Error:\n" + errorText);
                    return; 
                }
                
                // Parse the JSON returned by Python
                const data = await response.json();
                
                // Clear any old lines off the map from previous clicks
                map.eachLayer((layer) => {
                    if (layer instanceof L.Polyline) { 
                        layer.remove(); 
                    }
                });

                // Set up beautiful, distinct colors for up to 6 different trucks
                const colors = ['#ff0044', '#00e676', '#00d2ff', '#ffb300', '#b100ff', '#ff7b00'];
                let allBounds = L.latLngBounds();

                // Check if any routes were actually returned
                if (data.routes && data.routes.length > 0) {
                    
                    // Draw a line for every truck route returned by the AI
                    data.routes.forEach((truckRoute, index) => {
                        // Leaflet expects [Lat, Lon], but Python/GeoJSON sends [Lon, Lat]
                        // We must map over the array and flip them
                        const latLngs = truckRoute.map(coord => [coord[1], coord[0]]);
                        
                        // Pick a color based on the truck number
                        const routeColor = colors[index % colors.length];
                        
                        // Draw the glowing line
                        const polyline = L.polyline(latLngs, {
                            color: routeColor, 
                            weight: 5,
                            opacity: 0.8
                        }).addTo(map);
                        
                        // Expand the invisible camera box to include this route
                        allBounds.extend(polyline.getBounds());
                    });

                    // Zoom and pan the map to perfectly fit all the routes
                    map.fitBounds(allBounds, { padding: [20, 20] });
                    
                } else {
                    alert("No route found! The time limit might be too strict for the truck to leave the depot. Try increasing the minutes.");
                }

            } catch (error) {
                // Catch network errors (e.g., if Vercel is offline)
                alert("🚨 Network Error: Could not connect to the backend API.");
                console.error(error);
            }
        }
    </script>
</body>
</html>
