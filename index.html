<!DOCTYPE html>
<html>
<head>
    <title>LA Metro Routing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
        .controls { padding: 20px; background: #f4f4f4; }
    </style>
</head>
<body>

    <div class="controls">
        <label>Trucks:</label>
        <input type="number" id="trucks" value="1">
        <label>Time Limit (mins):</label>
        <input type="number" id="minutes" value="60">
        <button onclick="calculateRoute()">Optimize Route</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map centered on LA
        var map = L.map('map').setView([34.0522, -118.2437], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        async function calculateRoute() {
            const trucks = document.getElementById('trucks').value;
            const minutes = document.getElementById('minutes').value;

            // Send the data to your Python Backend
            const response = await fetch('/api/optimize', {
                method: 'POST',
                body: JSON.stringify({ trucks: parseInt(trucks), minutes: parseInt(minutes) })
            });
            
            const data = await response.json();
            
            // Clear any old lines off the map first
            map.eachLayer((layer) => {
                if (layer instanceof L.Polyline) { layer.remove(); }
            });

            // Draw a line for every truck route returned by the AI
            const colors = ['#ff0044', '#00e676', '#00d2ff', '#ffb300'];
            let allBounds = L.latLngBounds();

            data.routes.forEach((truckRoute, index) => {
                // Leaflet expects [Lat, Lon], so we flip the coordinates
                const latLngs = truckRoute.map(coord => [coord[1], coord[0]]);
                const routeColor = colors[index % colors.length];
                
                const polyline = L.polyline(latLngs, {color: routeColor, weight: 4}).addTo(map);
                allBounds.extend(polyline.getBounds());
            });

            if (data.routes.length > 0) {
                map.fitBounds(allBounds);
            } else {
                alert("No route found! Try increasing the time limit.");
            }
        }
    </script>
</body>
</html>
