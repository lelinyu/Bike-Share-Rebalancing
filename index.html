<!DOCTYPE html>
<html>
<head>
    <title>LA Metro Routing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map { 
            height: 85vh; 
            width: 100%; 
        }
        .controls { 
            padding: 20px; 
            background: #f4f4f4; 
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 2px solid #ddd;
        }
        button {
            padding: 8px 16px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0051a8;
        }
        
        /* The CSS Animation for the moving truck lines */
        .flowing-route {
            stroke-dasharray: 15 15; 
            animation: flow 1s linear infinite; 
        }

        @keyframes flow {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -30; } 
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="day"><strong>Day:</strong></label>
        <select id="day">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
        </select>

        <label for="time_block"><strong>Time:</strong></label>
        <select id="time_block">
            <option value="06:00-09:00">06:00 - 09:00</option>
            <option value="09:00-12:00">09:00 - 12:00</option>
            <option value="12:00-15:00">12:00 - 15:00</option>
            <option value="15:00-18:00">15:00 - 18:00</option>
        </select>

        <label for="capacity"><strong>Truck Capacity:</strong></label>
        <input type="number" id="capacity" value="20" min="5" max="100">

        <label for="trucks"><strong>Trucks:</strong></label>
        <input type="number" id="trucks" value="3" min="1" max="10">
        
        <label for="minutes"><strong>Time Limit:</strong></label>
        <input type="number" id="minutes" value="120" min="10" max="480">
        
        <button onclick="calculateRoute()">Optimize Route</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Initialize the map centered on Los Angeles
        var map = L.map('map').setView([34.0522, -118.2437], 12);
        
        // Use a dark theme map to make the bright route lines pop
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(map);

        // 2. The main function triggered when the button is clicked
        async function calculateRoute() {
            const trucks = document.getElementById('trucks').value;
            const minutes = document.getElementById('minutes').value;

            try {
                // Send the data to your Python Backend
                const response = await fetch('/api/optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        trucks: parseInt(trucks), 
                        minutes: parseInt(minutes) 
                    })
                });
                
                // SAFETY CHECK: If Python crashes, show the error on screen!
                if (!response.ok) {
                    const errorText = await response.text();
                    alert("🚨 Backend Error:\n" + errorText);
                    return; 
                }
                
                // Parse the JSON returned by Python
                const data = await response.json();
                
                // Clear old lines AND old markers from previous clicks
                map.eachLayer((layer) => {
                    if (layer instanceof L.Polyline || layer instanceof L.GeoJSON || layer instanceof L.Marker) { 
                        layer.remove(); 
                    }
                });

                // Distinct colors for different truck routes
                const colors = ['#ff0044', '#00e676', '#00d2ff', '#ffb300', '#b100ff', '#ff7b00'];
                let allBounds = L.latLngBounds();

                // Check if any routes were actually returned
                if (data.routes && data.routes.length > 0) {
                    
                    // --- Add a Marker for the Origin/Depot ---
                    // Grab the very first coordinate from the very first truck
                    const startLon = data.routes[0][0][0];
                    const startLat = data.routes[0][0][1];
                    
                    L.marker([startLat, startLon]).addTo(map)
                        .bindPopup("<b>📦 Central Depot</b><br>Truck Origin & Final Destination")
                        .openPopup();

                    // Loop through each truck's route
                    for (let i = 0; i < data.routes.length; i++) {
                        const truckRoute = data.routes[i];
                        const routeColor = colors[i % colors.length];

                        // Format coordinates for OSRM (lon,lat;lon,lat...)
                        const coordString = truckRoute.map(coord => `${coord[0]},${coord[1]}`).join(';');
                        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;
                        
                        try {
                            const osrmResponse = await fetch(osrmUrl);
                            const osrmData = await osrmResponse.json();

                            if (osrmData.code === 'Ok') {
                                const roadGeometry = osrmData.routes[0].geometry;
                                
                                // Draw the road-snapped GeoJSON route WITH the CSS Animation
                                const geoJsonLayer = L.geoJSON(roadGeometry, {
                                    style: { 
                                        color: routeColor, 
                                        weight: 6, 
                                        opacity: 0.9,
                                        className: 'flowing-route' // Applies the marching ants animation
                                    }
                                }).addTo(map);
                                
                                allBounds.extend(geoJsonLayer.getBounds());
                            } else {
                                console.warn("OSRM couldn't snap this route. Drawing straight lines instead.");
                                const latLngs = truckRoute.map(coord => [coord[1], coord[0]]);
                                const fallbackLine = L.polyline(latLngs, {
                                    color: routeColor, weight: 5, opacity: 0.8, className: 'flowing-route'
                                }).addTo(map);
                                allBounds.extend(fallbackLine.getBounds());
                            }
                        } catch (err) {
                            console.error("Failed to fetch street data from OSRM:", err);
                        }
                    }

                    // Zoom and pan the map to perfectly fit all the routes
                    if (allBounds.isValid()) {
                        map.fitBounds(allBounds, { padding: [20, 20] });
                    }
                    
                } else {
                    alert("No route found! The time limit might be too strict for the truck to leave the depot. Try increasing the minutes.");
                }

            } catch (error) {
                // Catch network errors (e.g., if Vercel is offline)
                alert("🚨 Network Error: Could not connect to the backend API.");
                console.error(error);
            }
        }
    </script>
</body>
</html>
