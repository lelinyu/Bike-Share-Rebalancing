<!DOCTYPE html>
<html>
<head>
    <title>LA Metro Routing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map { 
            height: 85vh; 
            width: 100%; 
        }
        .controls { 
            padding: 20px; 
            background: #f4f4f4; 
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 2px solid #ddd;
            flex-wrap: wrap; /* Allows wrapping on smaller screens */
        }
        button {
            padding: 8px 16px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0051a8;
        }
        
        .flowing-route {
            stroke-dasharray: 15 15; 
            animation: flow 1s linear infinite; 
        }

        @keyframes flow {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -30; } 
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="day"><strong>Day:</strong></label>
        <select id="day">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
        </select>

        <label for="time_block"><strong>Time:</strong></label>
        <select id="time_block">
            <option value="06:00-09:00">06:00 - 09:00</option>
            <option value="09:00-12:00">09:00 - 12:00</option>
            <option value="12:00-15:00">12:00 - 15:00</option>
            <option value="15:00-18:00">15:00 - 18:00</option>
        </select>

        <label for="capacity"><strong>Truck Capacity:</strong></label>
        <input type="number" id="capacity" value="20" min="5" max="100">

        <label for="trucks"><strong>Trucks:</strong></label>
        <input type="number" id="trucks" value="3" min="1" max="10">
        
        <label for="minutes"><strong>Time Limit:</strong></label>
        <input type="number" id="minutes" value="120" min="10" max="480">
        
        <button onclick="calculateRoute()">Optimize Route</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        var map = L.map('map').setView([34.0522, -118.2437], 12);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(map);

        async function calculateRoute() {
            const day = document.getElementById('day').value;
            const time_block = document.getElementById('time_block').value;
            const capacity = document.getElementById('capacity').value;
            const trucks = document.getElementById('trucks').value;
            const minutes = document.getElementById('minutes').value;

            try {
                const response = await fetch('/api/optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        day: day,
                        time_block: time_block,
                        capacity: parseInt(capacity),
                        trucks: parseInt(trucks), 
                        minutes: parseInt(minutes) 
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    alert("🚨 Backend Error:\n" + errorText);
                    return; 
                }
                
                const data = await response.json();
                
                // Clear old layers
                map.eachLayer((layer) => {
                    if (layer instanceof L.Polyline || layer instanceof L.GeoJSON || layer instanceof L.Marker || layer instanceof L.CircleMarker) { 
                        layer.remove(); 
                    }
                });

                const colors = ['#ff0044', '#00e676', '#00d2ff', '#ffb300', '#b100ff', '#ff7b00'];
                let allBounds = L.latLngBounds();

                if (data.routes && data.routes.length > 0) {
                    
                    // Central Depot Marker
                    const startLon = data.routes[0][0].coords[0];
                    const startLat = data.routes[0][0].coords[1];
                    
                    L.marker([startLat, startLon]).addTo(map)
                        .bindPopup("<b>📦 Central Depot</b><br>Truck Origin & Final Destination")
                        .openPopup();

                    for (let i = 0; i < data.routes.length; i++) {
                        const truckRoute = data.routes[i];
                        const routeColor = colors[i % colors.length];

                        // Extract coordinates for the OSRM routing string
                        const coordString = truckRoute.map(stop => `${stop.coords[0]},${stop.coords[1]}`).join(';');
                        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;
                        
                        try {
                            const osrmResponse = await fetch(osrmUrl);
                            const osrmData = await osrmResponse.json();

                            if (osrmData.code === 'Ok') {
                                const roadGeometry = osrmData.routes[0].geometry;
                                
                                const geoJsonLayer = L.geoJSON(roadGeometry, {
                                    style: { color: routeColor, weight: 6, opacity: 0.9, className: 'flowing-route' }
                                }).addTo(map);
                                
                                allBounds.extend(geoJsonLayer.getBounds());
                            } else {
                                const latLngs = truckRoute.map(stop => [stop.coords[1], stop.coords[0]]);
                                const fallbackLine = L.polyline(latLngs, {
                                    color: routeColor, weight: 5, opacity: 0.8, className: 'flowing-route'
                                }).addTo(map);
                                allBounds.extend(fallbackLine.getBounds());
                            }
                            
                            // --- NEW: Add Station Map Pins ---
                            truckRoute.forEach((stop, stopIndex) => {
                                // Skip placing standard pins on the Depot (first and last stop)
                                if (stopIndex !== 0 && stopIndex !== truckRoute.length - 1) {
                                    
                                    // Determine the action text (Pickup vs Dropoff)
                                    let actionText = "";
                                    if (stop.flux > 0) {
                                        actionText = `🟢 Picking up <b>${stop.flux}</b> bikes`;
                                    } else if (stop.flux < 0) {
                                        actionText = `🔴 Dropping off <b>${Math.abs(stop.flux)}</b> bikes`;
                                    } else {
                                        actionText = `⚪ No bikes exchanged`;
                                    }

                                    // Add a circle marker filled with the truck's color
                                    L.circleMarker([stop.coords[1], stop.coords[0]], {
                                        radius: 7,
                                        fillColor: routeColor,
                                        color: '#ffffff', // White border
                                        weight: 2,
                                        opacity: 1,
                                        fillOpacity: 1
                                    }).addTo(map)
                                    .bindPopup(`
                                        <div style="font-size: 14px;">
                                            <b>📍 Station ${stop.station_id}</b><br>
                                            <hr style="margin: 5px 0;">
                                            🚚 Served by: <b>Truck ${i + 1}</b><br>
                                            ${actionText}
                                        </div>
                                    `);
                                }
                            });
                            // ---------------------------------

                        } catch (err) {
                            console.error("Failed to fetch street data from OSRM:", err);
                        }
                    }

                    if (allBounds.isValid()) {
                        map.fitBounds(allBounds, { padding: [20, 20] });
                    }
                    
                } else {
                    alert("No route found! The time limit might be too strict for the truck to leave the depot. Try increasing the minutes.");
                }

            } catch (error) {
                alert("🚨 Network Error: Could not connect to the backend API.");
                console.error(error);
            }
        }
    </script>
</body>
</html>
